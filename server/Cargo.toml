[package]
name = "noita-coop-server"
description = "Authoritative run server: durable state, journal, claim arbitration"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
crc32fast = "1.5.5"
ctrlc = { version = "3.5.3", features = ["termination"] }
env_logger = "0.11.12"
getrandom = "0.4.3"
log = "0.4.35"
noita-coop-protocol = { version = "0.1.0", path = "../protocol" }
postcard = "1.1.3"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = "1.0.229"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
noita-coop-agent = { path = "../agent" }
tempfile = "3.27.0"
